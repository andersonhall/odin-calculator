<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="calculator.js" defer></script>
  </head>
  <body>
    <h1>Odin Calculator</h1>
    <div class="calculator-container">
      <div class="display"></div>
      <div class="keys">
        <button class="key digit">7</button>
        <button class="key digit">8</button>
        <button class="key digit">9</button>
        <button class="key operator">&divide;</button>
        <button class="key digit">4</button>
        <button class="key digit">5</button>
        <button class="key digit">6</button>
        <button class="key operator">&times;</button>
        <button class="key digit">1</button>
        <button class="key digit">2</button>
        <button class="key digit">3</button>
        <button class="key operator">&minus;</button>
        <button class="key clear">AC</button>
        <button class="key digit">0</button>
        <button class="key enter">&equals;</button>
        <button class="key operator">&plus;</button>
      </div>
    </div>
  </body>
</html>
